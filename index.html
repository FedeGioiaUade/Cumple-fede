<style>
  :root {
    --bg: oklch(0.972 0.014 84);
    --bg-2: oklch(0.955 0.018 82);
    --card: oklch(0.995 0.006 90);
    --ink: oklch(0.28 0.025 60);
    --ink-soft: oklch(0.48 0.02 62);
    --ink-faint: oklch(0.62 0.018 64);
    --line: oklch(0.9 0.014 78);
    --line-soft: oklch(0.93 0.012 80);

    --hombre: oklch(0.58 0.095 232);
    --hombre-bg: oklch(0.95 0.03 232);
    --mujer: oklch(0.6 0.105 18);
    --mujer-bg: oklch(0.95 0.035 24);

    --confirm: oklch(0.56 0.12 152);
    --confirm-bg: oklch(0.94 0.06 152);
    --invite: oklch(0.66 0.105 72);
    --invite-bg: oklch(0.95 0.05 78);

    --accent: oklch(0.62 0.16 38);
    --shadow: 0 1px 2px oklch(0.4 0.03 60 / 0.06), 0 8px 24px oklch(0.4 0.03 60 / 0.06);
    --shadow-sm: 0 1px 2px oklch(0.4 0.03 60 / 0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #root { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font-family: inherit; }
  ::selection { background: oklch(0.85 0.08 38); }

  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px 80px; display: flex; flex-direction: column; }
  .wrap > .filebar { order: 91; margin-top: 40px; }
  .wrap > .footer-note { order: 90; }

  /* ---------- Header ---------- */
  .hero {
    padding: 56px 0 28px;
    position: relative;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow .dots { display: inline-flex; gap: 4px; }
  .eyebrow .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .hero h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(44px, 7vw, 76px);
    line-height: 0.98;
    letter-spacing: -0.01em;
    margin: 14px 0 6px;
  }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero .sub { color: var(--ink-soft); font-size: 16px; max-width: 46ch; }
  .hero .editable { cursor: text; outline: none; border-radius: 6px; transition: background .15s; }
  .hero .editable:hover { background: oklch(0.93 0.02 80 / 0.6); }
  .hero .editable:focus { background: oklch(0.93 0.02 80 / 0.9); box-shadow: 0 0 0 2px var(--line); }

  /* ---------- Stats ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    margin-top: 34px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--line-soft);
    border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
  }
  .stat .n { font-family: "Instrument Serif", serif; font-size: 42px; line-height: 1; letter-spacing: -0.01em; }
  .stat .l { font-size: 13px; color: var(--ink-faint); margin-top: 7px; font-weight: 500; }
  .stat .tick { position: absolute; top: 16px; right: 16px; width: 9px; height: 9px; border-radius: 50%; }
  .stat.total .n { color: var(--ink); }
  .stat.hombres .n { color: var(--hombre); }
  .stat.mujeres .n { color: var(--mujer); }
  .stat.conf .n { color: var(--confirm); }

  .host-chip {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
    padding: 7px 13px 7px 9px; border-radius: 999px;
    background: oklch(0.62 0.16 38 / 0.1); border: 1px solid oklch(0.62 0.16 38 / 0.25);
    color: var(--accent); font-size: 13.5px; font-weight: 600;
  }
  .host-chip .crown { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: white; display: grid; place-items: center; }
  .host-chip b { color: var(--ink); }

  .progress-wrap {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line-soft);
    border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow-sm);
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px 28px;
  }
  .prog { display: flex; flex-direction: column; gap: 8px; }
  .prog.general { grid-column: 1 / -1; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
  .prog .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .prog .ttl { font-size: 13px; font-weight: 600; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px; }
  .prog .ttl i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .prog.general .ttl { font-size: 14px; color: var(--ink); }
  .prog .nums { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-faint); white-space: nowrap; }
  .prog .nums b { font-size: 15px; color: var(--ink); }
  .prog.general .nums b { color: var(--confirm); }
  .bar { height: 9px; border-radius: 999px; background: oklch(0.91 0.02 80); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

  /* ---------- Add form ---------- */
  .addbar {
    margin-top: 26px; background: var(--card); border: 1px solid var(--line-soft);
    border-radius: 18px; box-shadow: var(--shadow); padding: 16px;
    display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.grow { flex: 1; min-width: 160px; }
  .field label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); padding-left: 2px; }
  .field input {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 13px; font-size: 15px; color: var(--ink); outline: none; transition: border .15s, box-shadow .15s; width: 100%;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.62 0.16 38 / 0.13); }
  .field input::placeholder { color: var(--ink-faint); }

  .seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button { padding: 8px 14px; font-size: 14px; font-weight: 600; border-radius: 8px; color: var(--ink-soft); transition: all .15s; white-space: nowrap; }
  .seg button.on-h { background: var(--hombre); color: white; }
  .seg button.on-m { background: var(--mujer); color: white; }
  .seg button.on-c { background: var(--confirm); color: white; }
  .seg button.on-i { background: var(--invite); color: white; }

  .add-btn {
    background: var(--accent); color: white; font-weight: 600; font-size: 15px;
    padding: 12px 22px; border-radius: 11px; display: inline-flex; align-items: center; gap: 8px;
    transition: transform .12s, filter .15s; box-shadow: 0 4px 12px oklch(0.62 0.16 38 / 0.28);
  }
  .add-btn:hover { filter: brightness(1.05); }
  .add-btn:active { transform: scale(0.97); }
  .add-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  /* ---------- File bar ---------- */
  .filebar {
    margin-top: 26px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px;
    padding: 12px 14px 12px 16px; box-shadow: var(--shadow-sm);
  }
  .fb-status { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .fb-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--invite); flex-shrink: 0; box-shadow: 0 0 0 3px var(--invite-bg); }
  .filebar.is-on .fb-dot { background: var(--confirm); box-shadow: 0 0 0 3px var(--confirm-bg); }
  .filebar.is-read .fb-dot { background: var(--hombre); box-shadow: 0 0 0 3px var(--hombre-bg); }
  .filebar.is-busy .fb-dot { background: var(--invite); box-shadow: 0 0 0 3px var(--invite-bg); animation: pulse 1s ease-in-out infinite; }
  .filebar.is-error .fb-dot { background: var(--mujer); box-shadow: 0 0 0 3px var(--mujer-bg); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .fb-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .fb-text b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fb-text em { font-style: normal; font-size: 12px; color: var(--ink-faint); }
  .fb-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .fb-btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 10px;
    font-size: 13.5px; font-weight: 600; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink-soft); transition: all .15s;
  }
  .fb-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
  .fb-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .fb-btn.primary:hover { filter: brightness(1.15); color: var(--bg); }
  .fb-btn.danger { color: var(--mujer); border-color: var(--mujer-bg); }
  .fb-btn.danger:hover { background: var(--mujer-bg); border-color: var(--mujer); }
  .fb-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- Settings modal ---------- */
  .modal-back { position: fixed; inset: 0; background: oklch(0.3 0.02 60 / 0.5); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; z-index: 100; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 60px oklch(0.3 0.03 60 / 0.3);
    width: 100%; max-width: 540px; max-height: 90vh; overflow: auto; padding: 24px;
    animation: rise .2s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { font-family: "Instrument Serif", serif; font-size: 28px; font-weight: 400; }
  .modal-x { width: 32px; height: 32px; border-radius: 8px; color: var(--ink-faint); font-size: 15px; }
  .modal-x:hover { background: var(--bg-2); color: var(--ink); }
  .modal-intro { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 8px 0 18px; }
  .mf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mf { display: flex; flex-direction: column; gap: 6px; }
  .mf.full { grid-column: 1 / -1; }
  .mf span { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); }
  .mf input { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; color: var(--ink); outline: none; transition: border .15s, box-shadow .15s; }
  .mf input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.62 0.16 38 / 0.13); }
  .mf-help { margin-top: 16px; font-size: 13px; color: var(--ink-soft); background: var(--bg-2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; }
  .mf-help summary { cursor: pointer; font-weight: 600; color: var(--ink); }
  .mf-help ol { margin: 10px 0 2px; padding-left: 18px; line-height: 1.6; }
  .mf-help li { margin-bottom: 4px; }
  .mf-error { margin-top: 14px; background: var(--mujer-bg); color: var(--mujer); border-radius: 10px; padding: 10px 13px; font-size: 13px; font-weight: 500; }
  .modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; align-items: center; gap: 14px; margin-top: 30px; flex-wrap: wrap; }
  .search { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
  .search input {
    width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: 10px 14px 10px 38px; font-size: 14.5px; outline: none; transition: border .15s, box-shadow .15s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.62 0.16 38 / 0.13); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .chips { display: inline-flex; gap: 7px; }
  .chip {
    padding: 8px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); transition: all .15s;
  }
  .chip:hover { border-color: var(--ink-faint); }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---------- Columns ---------- */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px; }
  .col { background: var(--card); border: 1px solid var(--line-soft); border-radius: 20px; box-shadow: var(--shadow-sm); overflow: hidden; }
  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--line-soft);
  }
  .col-head .title { display: flex; align-items: center; gap: 11px; }
  .col-head .badge-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: white; }
  .col.h .badge-ico { background: var(--hombre); }
  .col.m .badge-ico { background: var(--mujer); }
  .col-head h2 { font-family: "Instrument Serif", serif; font-size: 27px; font-weight: 400; letter-spacing: -0.01em; }
  .col-head .count { font-size: 14px; font-weight: 600; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .col-head .count b { color: var(--confirm); }

  .list { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }

  .person {
    display: flex; align-items: center; gap: 13px; padding: 12px 14px;
    border-radius: 13px; background: var(--bg-2); border: 1px solid transparent;
    transition: border .15s, background .15s, transform .1s;
    animation: pop .28s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  .person:hover { border-color: var(--line); background: var(--card); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; color: white;
  }
  .col.h .avatar { background: var(--hombre); }
  .col.m .avatar { background: var(--mujer); }
  .person.host { background: oklch(0.62 0.16 38 / 0.07); border-color: oklch(0.62 0.16 38 / 0.22); }
  .person.host:hover { border-color: oklch(0.62 0.16 38 / 0.4); }
  .person.host .avatar { background: var(--accent); box-shadow: 0 0 0 3px var(--card), 0 0 0 4px oklch(0.62 0.16 38 / 0.35); }
  .host-badge { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: oklch(0.62 0.16 38 / 0.12); color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .person .info { flex: 1; min-width: 0; }
  .person .name { font-weight: 600; font-size: 15.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .who { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
  .person .who b { color: var(--ink-soft); font-weight: 600; }

  .status {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: all .15s; flex-shrink: 0;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status.confirmado { background: var(--confirm-bg); color: var(--confirm); }
  .status.confirmado .dot { background: var(--confirm); }
  .status.invitado { background: var(--invite-bg); color: var(--invite); }
  .status.invitado .dot { background: var(--invite); }
  .status:hover { filter: brightness(0.97); transform: translateY(-1px); }

  .del {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0;
    color: var(--ink-faint); opacity: 0; transition: all .15s;
  }
  .person:hover .del { opacity: 1; }
  .del:hover { background: var(--mujer-bg); color: var(--mujer); }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-faint); }
  .empty .serif { font-size: 22px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .empty p { font-size: 13.5px; }

  .footer-note { text-align: center; margin-top: 40px; color: var(--ink-faint); font-size: 13px; }
  .footer-note button { color: var(--mujer); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .progress-wrap { grid-template-columns: 1fr; }
    .filebar { align-items: stretch; }
    .fb-actions { width: 100%; }
    .fb-btn { flex: 1; justify-content: center; }
    .mf-grid { grid-template-columns: 1fr; }
    .cols { grid-template-columns: 1fr; }
    .addbar { flex-direction: column; align-items: stretch; }
    .addbar .seg { width: 100%; }
    .addbar .seg button { flex: 1; }
    .add-btn { justify-content: center; }
    .hero { padding-top: 40px; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const DEFAULT_META = { title: "El cumple de Fede", sub: "Viernes 10 de julio Â· 21 hs Â· Casa de Fede" };
const EMPTY_DATA = { meta: DEFAULT_META, people: [] };

function initials(name) {
  const p = name.trim().split(/\s+/);
  return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase() || "?";
}

function App() {
  const [people, setPeople] = useState(EMPTY_DATA.people);
  const [meta, setMeta] = useState(DEFAULT_META);

  // ---- Guardado: GitHub (sincroniza celu+compu) + respaldo JSON ----
  const GH_KEY = "cumple-gh-config";
  const [gh, setGh] = useState(() => { try { return JSON.parse(localStorage.getItem(GH_KEY)) || null; } catch (e) { return null; } });
  const [ghStatus, setGhStatus] = useState("off"); // off | loading | synced | saving | error
  const [ghError, setGhError] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [dataSource, setDataSource] = useState("memory"); // memory | local | github
  const fileInputRef = useRef(null);
  const skipSaveRef = useRef(true);
  const shaRef = useRef(null);
  const saveTimer = useRef(null);
  const lastSavedRef = useRef("");

  // form state
  const [name, setName] = useState("");
  const [who, setWho] = useState("Fede");
  const [gender, setGender] = useState("h");
  const [status, setStatus] = useState("invitado");

  // toolbar
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("todos"); // todos | confirmado | invitado

  const nameRef = useRef(null);

  // ---- Persistencia ----
  const snapshot = () => ({ meta, people, savedAt: new Date().toISOString() });
  const dataKey = (m, p) => JSON.stringify({ meta: m, people: p });

  const applyData = (data) => {
    if (data && Array.isArray(data.people)) setPeople(data.people);
    if (data && data.meta) setMeta({ ...DEFAULT_META, ...data.meta });
  };

  const loadLocalData = async () => {
    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      if (!res.ok) return false;
      applyData(await res.json());
      setDataSource("local");
      return true;
    } catch (e) {
      return false;
    }
  };

  // Helpers GitHub
  const b64encode = (str) => btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str)));
  const b64decode = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
  const ghHeaders = (cfg) => ({ "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
  const ghUrl = (cfg) => "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + cfg.path.split("/").map(encodeURIComponent).join("/");

  const ghLoad = async (cfg) => {
    setGhStatus("loading"); setGhError("");
    try {
      const r = await fetch(ghUrl(cfg) + "?ref=" + cfg.branch + "&t=" + Date.now(), { headers: ghHeaders(cfg), cache: "no-store" });
      if (r.status === 404) { shaRef.current = null; lastSavedRef.current = ""; setGhStatus("synced"); return false; }
      if (!r.ok) throw new Error(r.status === 401 ? "Token invÃ¡lido o sin permiso" : "No se pudo leer (HTTP " + r.status + ")");
      const j = await r.json();
      shaRef.current = j.sha;
      const data = JSON.parse(b64decode(j.content));
      const m = { ...DEFAULT_META, ...(data.meta || {}) };
      const p = Array.isArray(data.people) ? data.people : [];
      setMeta(m); setPeople(p);
      lastSavedRef.current = dataKey(m, p);
      setDataSource("github");
      setGhStatus("synced");
      return true;
    } catch (e) { setGhStatus("error"); setGhError(e.message); return false; }
  };

  const ghSave = async (cfg) => {
    setGhStatus("saving"); setGhError("");
    try {
      // traer el sha mÃ¡s reciente para no pisar cambios hechos en otro dispositivo
      try {
        const head = await fetch(ghUrl(cfg) + "?ref=" + cfg.branch + "&t=" + Date.now(), { headers: ghHeaders(cfg), cache: "no-store" });
        if (head.ok) shaRef.current = (await head.json()).sha;
        else if (head.status === 404) shaRef.current = null;
      } catch (e) {}
      const body = { message: "Actualizar lista de invitados â€” " + new Date().toLocaleString("es-AR"), content: b64encode(JSON.stringify(snapshot(), null, 2)), branch: cfg.branch };
      if (shaRef.current) body.sha = shaRef.current;
      const r = await fetch(ghUrl(cfg), { method: "PUT", headers: ghHeaders(cfg), body: JSON.stringify(body) });
      if (!r.ok) throw new Error(r.status === 401 ? "Token sin permiso de escritura" : r.status === 409 ? "Conflicto: recargÃ¡ para traer la Ãºltima versiÃ³n" : "No se pudo guardar (HTTP " + r.status + ")");
      const j = await r.json();
      shaRef.current = j.content.sha;
      lastSavedRef.current = dataKey(meta, people);
      setDataSource("github");
      setGhStatus("synced");
    } catch (e) { setGhStatus("error"); setGhError(e.message); }
  };

  // Carga inicial: si hay GitHub configurado, traer del repo; si no, leer data.json local (solo lectura)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (gh && gh.token) {
        const loaded = await ghLoad(gh);
        if (!loaded && !cancelled) {
          const hasLocalFallback = await loadLocalData();
          if (!hasLocalFallback) setDataSource("memory");
        }
      } else {
        const loaded = await loadLocalData();
        if (!loaded && !cancelled) setDataSource("memory");
      }
      if (!cancelled) setTimeout(() => { skipSaveRef.current = false; }, 0);
    })();
    return () => { cancelled = true; };
  }, []);

  // Autoguardado en GitHub (con rebote) ante cambios reales
  useEffect(() => {
    if (skipSaveRef.current || !gh || !gh.token) return;
    if (dataKey(meta, people) === lastSavedRef.current) return;
    clearTimeout(saveTimer.current);
    setGhStatus("saving");
    saveTimer.current = setTimeout(() => ghSave(gh), 1200);
    return () => clearTimeout(saveTimer.current);
  }, [people, meta]);

  // Al volver a la pestaÃ±a, refrescar desde el repo (ver cambios de otro dispositivo)
  useEffect(() => {
    if (!gh || !gh.token) return;
    const onFocus = () => { if (ghStatus !== "saving") ghLoad(gh); };
    window.addEventListener("focus", onFocus);
    return () => window.removeEventListener("focus", onFocus);
  }, [gh, ghStatus]);

  const connectGitHub = async (cfg) => {
    localStorage.setItem(GH_KEY, JSON.stringify(cfg));
    setGh(cfg); setShowSettings(false);
    skipSaveRef.current = true;
    const existed = await ghLoad(cfg);
    if (!existed && shaRef.current === null) { await ghSave(cfg); } // crear el archivo con los datos actuales
    setTimeout(() => { skipSaveRef.current = false; }, 0);
  };
  const disconnectGitHub = () => { localStorage.removeItem(GH_KEY); setGh(null); setGhStatus("off"); setGhError(""); shaRef.current = null; setDataSource("memory"); };
  const retryGitHub = () => { if (gh && gh.token) ghLoad(gh); };

  // Respaldo manual
  const downloadJSON = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(snapshot(), null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "invitados.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const importJSON = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { applyData(JSON.parse(reader.result)); } catch (err) { alert("El archivo no es un JSON vÃ¡lido."); } };
    reader.readAsText(file);
    e.target.value = "";
  };

  const add = () => {
    const n = name.trim();
    if (!n) return;
    setPeople(p => [...p, { id: Date.now(), name: n, gender, who: who.trim() || "â€”", status }]);
    setName(""); setWho("Fede");
    nameRef.current && nameRef.current.focus();
  };

  const toggleStatus = (id) =>
    setPeople(p => p.map(x => x.id === id ? { ...x, status: x.status === "confirmado" ? "invitado" : "confirmado" } : x));

  const remove = (id) => setPeople(p => p.filter(x => x.id !== id));

  // derived
  const matches = (x) => {
    const q = query.trim().toLowerCase();
    const okQ = !q || x.name.toLowerCase().includes(q) || x.who.toLowerCase().includes(q);
    const okF = filter === "todos" || x.status === filter;
    return okQ && okF;
  };
  const visible = people.filter(matches);
  const hombres = visible.filter(x => x.gender === "h");
  const mujeres = visible.filter(x => x.gender === "m");

  const total = people.length;
  const tH = people.filter(x => x.gender === "h").length;
  const tM = people.filter(x => x.gender === "m").length;
  const tConf = people.filter(x => x.status === "confirmado").length;
  const cH = people.filter(x => x.gender === "h" && x.status === "confirmado").length;
  const cM = people.filter(x => x.gender === "m" && x.status === "confirmado").length;
  const pct = total ? Math.round((tConf / total) * 100) : 0;

  const onMetaInput = (key) => (e) => setMeta(m => ({ ...m, [key]: e.currentTarget.textContent }));

  const confettiColors = ["var(--accent)", "var(--hombre)", "var(--mujer)", "var(--confirm)", "var(--invite)"];

  return (
    <div className="wrap">
      {/* HERO */}
      <header className="hero">
        <span className="eyebrow">
          <span className="dots">
            {confettiColors.slice(0,4).map((c,i)=>(<i key={i} style={{background:c}} />))}
          </span>
          Lista de invitados
        </span>
        <h1>
          <span className="editable" contentEditable suppressContentEditableWarning onBlur={onMetaInput("title")}>{meta.title}</span>
        </h1>
        <p className="sub editable" contentEditable suppressContentEditableWarning onBlur={onMetaInput("sub")}>{meta.sub}</p>

        {/* STATS */}
        <div className="stats">
          <div className="stat total"><div className="n">{total}</div><div className="l">Invitados en total</div></div>
          <div className="stat hombres"><span className="tick" style={{background:"var(--hombre)"}}></span><div className="n">{tH}</div><div className="l">Hombres</div></div>
          <div className="stat mujeres"><span className="tick" style={{background:"var(--mujer)"}}></span><div className="n">{tM}</div><div className="l">Mujeres</div></div>
          <div className="stat conf"><span className="tick" style={{background:"var(--confirm)"}}></span><div className="n">{tConf}</div><div className="l">Confirmados</div></div>
        </div>
        <div className="progress-wrap">
          <div className="prog general">
            <div className="top">
              <span className="ttl">Confirmaciones en total</span>
              <span className="nums"><b>{tConf}</b> de {total} Â· {pct}%</span>
            </div>
            <div className="bar"><i style={{ width: pct + "%", background: "var(--confirm)" }}></i></div>
          </div>
          <div className="prog">
            <div className="top">
              <span className="ttl"><i style={{background:"var(--hombre)"}}></i>Hombres</span>
              <span className="nums"><b>{cH}</b>/{tH}</span>
            </div>
            <div className="bar"><i style={{ width: (tH ? (cH/tH*100) : 0) + "%", background: "var(--hombre)" }}></i></div>
          </div>
          <div className="prog">
            <div className="top">
              <span className="ttl"><i style={{background:"var(--mujer)"}}></i>Mujeres</span>
              <span className="nums"><b>{cM}</b>/{tM}</span>
            </div>
            <div className="bar"><i style={{ width: (tM ? (cM/tM*100) : 0) + "%", background: "var(--mujer)" }}></i></div>
          </div>
          <div className="prog">
            <div className="top">
              <span className="ttl"><i style={{background:"var(--invite)"}}></i>Pendientes</span>
              <span className="nums"><b>{total - tConf}</b></span>
            </div>
            <div className="bar"><i style={{ width: (total ? ((total-tConf)/total*100) : 0) + "%", background: "var(--invite)" }}></i></div>
          </div>
        </div>
      </header>

      {/* SYNC BAR */}
      <div className={"filebar " + (ghStatus === "error" ? "is-error" : ghStatus === "synced" ? "is-on" : (ghStatus === "saving" || ghStatus === "loading") ? "is-busy" : dataSource === "local" ? "is-read" : "")}>
        <div className="fb-status">
          <span className="fb-dot"></span>
          {gh && gh.token ? (
            <span className="fb-text">
              <b>
                {ghStatus === "synced" ? "Sincronizado con GitHub âœ“"
                  : ghStatus === "saving" ? "Guardandoâ€¦"
                  : ghStatus === "loading" ? "Trayendo la Ãºltima versiÃ³nâ€¦"
                  : ghStatus === "error" ? "No se pudo sincronizar"
                  : "GitHub conectado"}
              </b>
              <em>{ghStatus === "error" ? ghError : gh.owner + "/" + gh.repo + " Â· " + gh.path}</em>
            </span>
          ) : dataSource === "local" ? (
            <span className="fb-text">
              <b>Modo local: leyendo data.json</b>
              <em>PodÃ©s editar, pero no se guarda online hasta conectar GitHub</em>
            </span>
          ) : (
            <span className="fb-text">
              <b>Modo temporal en este navegador</b>
              <em>ConectÃ¡ GitHub para persistir cambios y sincronizar dispositivos</em>
            </span>
          )}
        </div>
        <div className="fb-actions">
          {gh && gh.token ? (
            <React.Fragment>
              {ghStatus === "error" && <button className="fb-btn" onClick={retryGitHub}>Reintentar</button>}
              <button className="fb-btn" onClick={()=>setShowSettings(true)} title="Ajustes de sincronizaciÃ³n">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Ajustes
              </button>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <button className="fb-btn" onClick={downloadJSON}>Descargar JSON</button>
              <button className="fb-btn primary" onClick={()=>setShowSettings(true)}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-1.7c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.6-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
                Conectar con GitHub
              </button>
            </React.Fragment>
          )}
          <input ref={fileInputRef} type="file" accept=".json,application/json" onChange={importJSON} style={{display:"none"}} />
        </div>
      </div>

      {/* ADD FORM */}
      <div className="addbar">
        <div className="field grow">
          <label>Nombre</label>
          <input ref={nameRef} value={name} onChange={e=>setName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Â¿QuiÃ©n viene?" />
        </div>
        <div className="field grow">
          <label>Lo invitÃ³</label>
          <input value={who} onChange={e=>setWho(e.target.value)} list="inviters"
            onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Ej: Caro, Nico, Yoâ€¦" />
          <datalist id="inviters">
            {[...new Set(people.map(p=>p.who).filter(w=>w&&w!=="â€”"))].map(w=>(<option key={w} value={w} />))}
          </datalist>
        </div>
        <div className="field">
          <label>GÃ©nero</label>
          <div className="seg">
            <button className={gender==="h"?"on-h":""} onClick={()=>setGender("h")}>Hombre</button>
            <button className={gender==="m"?"on-m":""} onClick={()=>setGender("m")}>Mujer</button>
          </div>
        </div>
        <div className="field">
          <label>Estado</label>
          <div className="seg">
            <button className={status==="invitado"?"on-i":""} onClick={()=>setStatus("invitado")}>Invitado</button>
            <button className={status==="confirmado"?"on-c":""} onClick={()=>setStatus("confirmado")}>Confirmado</button>
          </div>
        </div>
        <button className="add-btn" onClick={add} disabled={!name.trim()}>+ Agregar</button>
      </div>

      {/* TOOLBAR */}
      <div className="toolbar">
        <div className="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar por nombre o quiÃ©n invitÃ³â€¦" />
        </div>
        <div className="chips">
          {[["todos","Todos"],["confirmado","Confirmados"],["invitado","Invitados"]].map(([k,l])=>(
            <button key={k} className={"chip"+(filter===k?" active":"")} onClick={()=>setFilter(k)}>{l}</button>
          ))}
        </div>
      </div>

      {/* COLUMNS */}
      <div className="cols">
        <Column kind="h" title="Hombres" people={hombres} totalConf={hombres.filter(x=>x.status==="confirmado").length}
          onToggle={toggleStatus} onRemove={remove} />
        <Column kind="m" title="Mujeres" people={mujeres} totalConf={mujeres.filter(x=>x.status==="confirmado").length}
          onToggle={toggleStatus} onRemove={remove} />
      </div>

      <p className="footer-note">
        {gh && gh.token
          ? <span>Se guarda solo en <b>{gh.owner}/{gh.repo}</b> y se sincroniza entre tus dispositivos.</span>
          : dataSource === "local"
            ? <span>La lista visible viene de <b>data.json</b>, pero los cambios no impactan GitHub Pages hasta conectar GitHub.</span>
            : <span>ConectÃ¡ GitHub arriba para guardar online y sincronizar.</span>}{" "}
        <button onClick={()=>{ if(confirm("Â¿Borrar toda la lista? Esto deja solo al anfitriÃ³n.")){ setPeople(p => p.filter(x => x.host)); } }}>Vaciar lista</button>
      </p>

      {showSettings && (
        <SettingsModal
          initial={gh}
          status={ghStatus}
          error={ghError}
          onClose={()=>setShowSettings(false)}
          onConnect={connectGitHub}
          onDisconnect={()=>{ disconnectGitHub(); setShowSettings(false); }}
        />
      )}
    </div>
  );
}

function detectRepo() {
  let owner = "", repo = "";
  try {
    const host = location.hostname;
    if (host.endsWith(".github.io")) {
      owner = host.replace(".github.io", "");
      const seg = location.pathname.split("/").filter(Boolean);
      repo = seg[0] || (owner + ".github.io");
    }
  } catch (e) {}
  return { owner, repo, path: "data.json", branch: "main", token: "" };
}

function SettingsModal({ initial, status, error, onClose, onConnect, onDisconnect }) {
  const base = initial || detectRepo();
  const [owner, setOwner] = useState(base.owner || "");
  const [repo, setRepo] = useState(base.repo || "");
  const [path, setPath] = useState(base.path || "data.json");
  const [branch, setBranch] = useState(base.branch || "main");
  const [token, setToken] = useState(base.token || "");
  const connected = !!(initial && initial.token);
  const canSave = owner.trim() && repo.trim() && path.trim() && branch.trim() && token.trim();
  const submit = () => canSave && onConnect({ owner: owner.trim(), repo: repo.trim(), path: path.trim().replace(/^\/+/, ""), branch: branch.trim(), token: token.trim() });

  return (
    <div className="modal-back" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <h3>Sincronizar con GitHub</h3>
          <button className="modal-x" onClick={onClose}>âœ•</button>
        </div>
        <p className="modal-intro">
          Tu lista se guarda como un archivo JSON en un repositorio tuyo de GitHub. Se sincroniza entre el celu y la compu, sin base de datos. PegÃ¡s el token una vez en cada dispositivo (queda solo en este navegador).
        </p>

        <div className="mf-grid">
          <label className="mf"><span>Usuario / organizaciÃ³n</span><input value={owner} onChange={e=>setOwner(e.target.value)} placeholder="tu-usuario" /></label>
          <label className="mf"><span>Repositorio</span><input value={repo} onChange={e=>setRepo(e.target.value)} placeholder="mi-cumple" /></label>
          <label className="mf"><span>Archivo (ruta)</span><input value={path} onChange={e=>setPath(e.target.value)} placeholder="data.json" /></label>
          <label className="mf"><span>Rama</span><input value={branch} onChange={e=>setBranch(e.target.value)} placeholder="main" /></label>
          <label className="mf full"><span>Token de acceso</span><input type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="github_pat_â€¦" /></label>
        </div>

        <details className="mf-help">
          <summary>Â¿CÃ³mo saco el token? (1 minuto)</summary>
          <ol>
            <li>EntrÃ¡ a <b>github.com â†’ Settings â†’ Developer settings â†’ Fine-grained tokens â†’ Generate new token</b>.</li>
            <li>En <b>Repository access</b> elegÃ­ â€œOnly select repositoriesâ€ y marcÃ¡ tu repo de la lista.</li>
            <li>En <b>Permissions â†’ Repository â†’ Contents</b>, ponelo en <b>Read and write</b>.</li>
            <li>GenerÃ¡ el token, copialo y pegalo acÃ¡ arriba.</li>
          </ol>
        </details>

        {status === "error" && <div className="mf-error">{error || "RevisÃ¡ los datos e intentÃ¡ de nuevo."}</div>}

        <div className="modal-actions">
          {connected && <button className="fb-btn danger" onClick={onDisconnect}>Desconectar</button>}
          <div style={{flex:1}}></div>
          <button className="fb-btn" onClick={onClose}>Cancelar</button>
          <button className="fb-btn primary" disabled={!canSave} onClick={submit}>
            {status === "loading" || status === "saving" ? "Conectandoâ€¦" : connected ? "Guardar cambios" : "Conectar y sincronizar"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Column({ kind, title, people, totalConf, onToggle, onRemove }) {
  return (
    <section className={"col " + kind}>
      <div className="col-head">
        <div className="title">
          <span className="badge-ico">
            {kind === "h"
              ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="7" r="4"/><path d="M12 11v9M8.5 16h7"/></svg>}
          </span>
          <h2>{title}</h2>
        </div>
        <div className="count">{people.length} Â· <b>{totalConf} conf.</b></div>
      </div>
      <div className="list">
        {people.length === 0 ? (
          <div className="empty">
            <span className="serif">TodavÃ­a nadie por acÃ¡</span>
            <p>AgregÃ¡ invitados con el formulario de arriba.</p>
          </div>
        ) : people.map(p => (
          <div className={"person" + (p.host ? " host" : "")} key={p.id}>
            <div className="avatar">{initials(p.name)}</div>
            <div className="info">
              <div className="name">{p.name}</div>
              <div className="who">{p.host ? "AnfitriÃ³n del cumple" : <span>Lo invitÃ³ <b>{p.who}</b></span>}</div>
            </div>
            {p.host && (
              <span className="host-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4 4 5-7 5 7 4-4-2 12H5L3 7z"/></svg>
                Admin
              </span>
            )}
            <button className={"status " + p.status} onClick={()=>onToggle(p.id)} title="Cambiar estado">
              <span className="dot"></span>
              {p.status === "confirmado" ? "Confirmado" : "Invitado"}
            </button>
            {!p.host && (
              <button className="del" onClick={()=>onRemove(p.id)} title="Eliminar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
              </button>
            )}
          </div>
        ))}
      </div>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
